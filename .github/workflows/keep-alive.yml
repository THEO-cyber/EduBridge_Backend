name: Keep Render awake

# Pings the deployed health endpoint so the free Render instance doesn't sleep.
# Runs on GitHub's infrastructure (independent of any local session).
on:
  schedule:
    # Every 5 minutes. GitHub's scheduler is best-effort and often runs late,
    # so we schedule more often than the 15-min Render sleep window to be safe.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 --retry 4 --retry-delay 15 --retry-all-errors \
            https://edubridge-api-s5l4.onrender.com/api/v1/health/live \
            && echo " — pinged OK" || echo "ping failed (will retry next run)"
