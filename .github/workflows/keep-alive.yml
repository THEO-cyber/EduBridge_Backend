name: Keep Render awake

# Pings the deployed health endpoint so the free Render instance doesn't sleep.
# Runs on GitHub's infrastructure (independent of any local session).
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 60 \
            https://edubridge-api-s5l4.onrender.com/api/v1/health/live \
            && echo " — pinged OK" || echo "ping failed (will retry next run)"
